spring.application.name=quincaillerie-backend

# --- Base de donnees ---
# DB_NAME separe du host/port : la base par defaut creee par le plugin MySQL
# de Railway s'appelle "railway", pas "quincaillerie_mvogt" - a definir via
# variable d'environnement plutot que fige en dur.
# allowPublicKeyRetrieval=true : requis par le mode d'authentification par
# defaut (caching_sha2_password) du MySQL fourni par Railway.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quincaillerie_mvogt}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Le schema est gere par Flyway, Hibernate ne doit pas le modifier automatiquement.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Serveur ---
# Railway injecte PORT au demarrage du conteneur (attribue dynamiquement) ;
# SERVER_PORT reste dispo comme fallback pour un usage hors Railway.
server.port=${PORT:${SERVER_PORT:8080}}
# Railway termine le TLS au niveau du proxy et transmet les en-tetes
# X-Forwarded-* : sans ceci, Spring voit toutes les requetes comme du HTTP
# simple sur le port interne du conteneur.
server.forward-headers-strategy=framework

# --- JWT ---
app.jwt.secret=${JWT_SECRET:changeme-dev-secret-please-override-in-production-min-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# --- CORS (utilise par SecurityConfig) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# --- Actuator (healthcheck Railway) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
